name: build games 

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"
  push:
    branches:
      - master
    paths:
      - games/**

jobs:
  push:
    name: "games:${{ matrix.games }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        games:
          - azerothcore

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v4
        with:
          context: ./games/${{ matrix.games }}
          file: ./games/${{ matrix.games }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/squashyhydra/games:${{ matrix.games }}
